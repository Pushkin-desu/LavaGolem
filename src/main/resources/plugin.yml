name: LavaGolem
version: 1.0.1
main: io.github.pushkindesu.lavagolem.LavaGolemPlugin
api-version: '1.21'
authors: [Pushkin-desu]
website: https://github.com/Pushkin-desu/LavaGolem
description: Automated lava-fetching golems for survival servers.
commands:
  removegolems:
    description: Remove all lava golems from the server
    permission: lavagolem.admin
  golemstats:
    description: Show aggregate statistics for all lava golems
    permission: lavagolem.admin
permissions:
  lavagolem.admin:
    description: Administrative commands for LavaGolem
    default: op
